# SPDX-License-Identifier: MIT
# ClusterFuzzLite: short code-change fuzzing on PRs, longer batch run weekly.
# See https://google.github.io/clusterfuzzlite/
name: ClusterFuzzLite

on:
  pull_request:
    branches: [main]
    paths:
      - '**.py'
      - '.clusterfuzzlite/**'
      - '.github/workflows/cflite.yml'
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Build fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          sanitizer: address
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: ${{ github.event_name == 'pull_request' && 'code-change' || 'batch' }}
          fuzz-seconds: ${{ github.event_name == 'pull_request' && 300 || 1800 }}
          sanitizer: address
