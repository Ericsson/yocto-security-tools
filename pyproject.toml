# SPDX-License-Identifier: MIT
[project]
name = "yocto-security-tools"
version = "1.4"
description = "Standalone CVE management tools for Yocto/OpenEmbedded — find fix commits, automate backporting, and resolve conflicts with AI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Daniel Turull (Ericsson AB)"},
]
maintainers = [
    {name = "Daniel Turull", email = "daniel.turull@ericsson.com"},
]
keywords = ["cve", "yocto", "openembedded", "security", "backport", "devtool"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Security",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Software Distribution",
]
dependencies = [
    "requests>=2.28,<3",
    "packaging>=23.0,<27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<10",
    "pytest-cov>=4.0,<8",
    "mypy>=1.8,<3",
    "ruff>=0.4,<1",
]

[project.urls]
Homepage = "https://github.com/Ericsson/yocto-security-tools"
Repository = "https://github.com/Ericsson/yocto-security-tools"
Issues = "https://github.com/Ericsson/yocto-security-tools/issues"
Changelog = "https://github.com/Ericsson/yocto-security-tools/blob/main/CHANGELOG.md"

[project.scripts]
cve-agent = "cve_agent.__main__:main"
cve-corrector = "cve_corrector.__main__:main"
cve-metadata-extractor = "cve_metadata_extractor.__main__:main"
cve-oe-backport = "cve_oe_backport.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "integration: tests that create git repos or require external resources",
    "live: opt-in tests that contact a real AI backend CLI or model endpoint",
]

[tool.coverage.run]
source = ["cve_agent", "cve_corrector", "cve_metadata_extractor", "cve_oe_backport", "shared"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 65

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["cve_metadata_extractor.*", "cve_oe_backport.*"]
disable_error_code = ["var-annotated"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# E501: line length is handled by formatting, not a hard rule.
# UP042: str+Enum -> enum.StrEnum is an unsafe fix (ruff won't auto-apply it)
# with behavioral differences (repr/str/format); left as a deliberate,
# separate refactor rather than mass-converting enums for this version bump.
ignore = ["E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["SIM117", "E741", "SIM105", "E402"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cve_agent*", "cve_corrector*", "cve_metadata_extractor*", "cve_oe_backport*", "shared*"]

[tool.setuptools.package-data]
cve_metadata_extractor = ["config.json"]
cve_agent = ["AGENT_INSTRUCTIONS.md", "instructions/*.md", "agents/*.json"]
